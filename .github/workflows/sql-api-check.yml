name: Validar API SQL
on:
  push:
    paths: ['agenda-sql-api/**', '.github/workflows/sql-api-check.yml']
  pull_request:
    paths: ['agenda-sql-api/**', '.github/workflows/sql-api-check.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agenda-sql-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: agenda-sql-api/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check
